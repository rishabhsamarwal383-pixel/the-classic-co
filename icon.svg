<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1d1a"/>
      <stop offset="50%" stop-color="#181716"/>
      <stop offset="100%" stop-color="#0f0e0d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="40%" stop-color="#b48448"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c622a"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2724"/>
      <stop offset="50%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#0a0a09"/>
    </linearGradient>
    <linearGradient id="glareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners for PWA app icon -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle gold border ring -->
  <rect x="18" y="18" width="476" height="476" rx="94" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Luxury Eyewear Silhouette Group -->
  <g transform="translate(256, 215)">
    <!-- Left Lens Frame -->
    <path d="M -160,-30 C -160,-65 -130,-75 -85,-75 C -40,-75 -25,-60 -25,-25 C -25,25 -45,65 -85,65 C -135,65 -160,25 -160,-30 Z" 
          fill="url(#lensGrad)" stroke="url(#goldGrad)" stroke-width="10" stroke-linejoin="round"/>
    
    <!-- Left Lens Glare reflection -->
    <path d="M -145,-30 C -145,-55 -125,-62 -95,-62 C -115,-40 -125,-10 -120,35 C -138,20 -145,-5 -145,-30 Z" 
          fill="url(#glareGrad)"/>

    <!-- Right Lens Frame -->
    <path d="M 25,-25 C 25,-60 40,-75 85,-75 C 130,-75 160,-65 160,-30 C 160,25 135,65 85,65 C 45,65 25,25 25,-25 Z" 
          fill="url(#lensGrad)" stroke="url(#goldGrad)" stroke-width="10" stroke-linejoin="round"/>
    
    <!-- Right Lens Glare reflection -->
    <path d="M 40,-25 C 40,-50 60,-62 90,-62 C 70,-40 60,-10 65,35 C 47,20 40,-5 40,-25 Z" 
          fill="url(#glareGrad)"/>

    <!-- Nose Bridge -->
    <path d="M -25,-32 Q 0,-44 25,-32" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <!-- Top Brow Bar (Aviator/Studio double bridge) -->
    <path d="M -95,-75 Q 0,-92 95,-75" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>

    <!-- Left Temple Hinge -->
    <path d="M -160,-32 L -185,-34 Q -195,-35 -200,-25" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>
    <!-- Right Temple Hinge -->
    <path d="M 160,-32 L 185,-34 Q 195,-35 200,-25" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="380" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#faf9f6" text-anchor="middle" letter-spacing="5">THE CLASSIC CO.</text>
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#d4af37" text-anchor="middle" letter-spacing="4">STUDIO EYEWEAR · UDAIPUR</text>
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8c857b" text-anchor="middle" letter-spacing="2">45-MIN EXPRESS DOORSTEP TRIAL</text>
</svg>
